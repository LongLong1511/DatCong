<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0891b2">
    <meta name="description" content="Bản đồ vệ tinh Phường Long Hương, TP.HCM">
    <title>Phường Long Hương - Bản Đồ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        /* Right Control Panel */
        .control-panel {
            position: fixed;
            right: 12px;
            top: 70px;
            width: 280px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            z-index: 999;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            padding: 0;
        }

        .control-panel.active {
            transform: translateX(0);
        }

        .control-panel-header {
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: white;
            padding: 16px 16px;
            font-size: 13px;
            font-weight: 700;
            border-bottom: 2px solid #0e7490;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-panel-content {
            padding: 16px;
        }

        .control-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .control-item input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .control-item label {
            cursor: pointer;
            flex: 1;
        }

        .control-item:hover {
            background: #f0f9ff;
            margin: 0 -8px;
            padding: 8px 8px;
            border-radius: 4px;
        }

        .control-section {
            margin-bottom: 16px;
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .control-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #0891b2;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Stats - Hidden */
        .stats {
            display: none !important;
        }

        /* Floating Search - Hidden */
        .floating-search {
            display: none !important;
        }

        .floating-search-panel {
            display: none !important;
        }

        /* Layer Controls */
        .layer-control {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .layer-control input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .layer-control label {
            cursor: pointer;
            flex: 1;
        }

        .layer-control:hover {
            background: #f0f9ff;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: white;
            padding: 25px 20px;
            border-bottom: 2px solid #0e7490;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: #0891b2;
            border-radius: 3px;
        }

        /* Sections */
        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #0891b2;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }

        /* Search */
        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #0891b2;
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        .search-box.hidden {
            display: none;
        }

        .search-toggle {
            background: none;
            border: none;
            color: #0891b2;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 0;
            margin-bottom: 12px;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #0891b2;
        }

        .stat-label {
            font-size: 10px;
            color: #0c7792;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px 12px;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
        }

        /* Info */
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .info-box h3 {
            font-size: 12px;
            font-weight: 700;
            color: #0891b2;
            margin-bottom: 8px;
        }

        .info-item {
            font-size: 11px;
            color: #475569;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        /* Legend */
        .legend {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }

        .legend h3 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0891b2;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* Map */
        .map-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Map Controls */
        .map-control {
            position: absolute;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 999;
            padding: 12px;
            font-size: 11px;
        }


        .coordinates {
            bottom: 20px;
            left: 20px;
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .status {
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .status.loading {
            color: #f59e0b;
        }

        .status.success {
            color: #10b981;
        }

        /* Menu Toggle Button - Hidden */
        .menu-toggle {
            display: none !important;
        }

        /* Control Panel Toggle Button - Desktop */
        .control-panel-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
        }

        .control-panel-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(8, 145, 178, 0.4);
        }

        /* Right Control Panel - Desktop */
        .control-panel {
            position: fixed;
            right: 12px;
            top: 70px;
            width: 280px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            z-index: 999;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            padding: 0;
        }

        .control-panel.active {
            transform: translateX(0);
        }

        /* Floating Search Button */
        .floating-search {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
            z-index: 998;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-search:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(8, 145, 178, 0.4);
        }

        .floating-search-panel {
            position: fixed;
            bottom: 150px;
            right: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 12px;
            width: 220px;
            z-index: 998;
            display: none;
        }

        .floating-search-panel.active {
            display: block;
        }

        .floating-search-panel input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .floating-search-panel input:focus {
            outline: none;
            border-color: #0891b2;
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 0;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                transition: max-height 0.3s ease;
                z-index: 999;
                border-radius: 0;
            }

            .sidebar:not(.active) {
                max-height: 0;
            }

            .sidebar.active {
                max-height: 100vh;
            }

            .map-container {
                width: 100%;
                height: calc(100vh - 50px);
            }

            .menu-toggle {
                position: fixed;
                top: 12px;
                right: 12px;
                width: 44px;
                height: 44px;
                background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
                border: none;
                border-radius: 50%;
                color: white;
                cursor: pointer;
                font-size: 20px;
                box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
                z-index: 1001;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                transition: all 0.3s ease;
            }

            .menu-toggle:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 16px rgba(8, 145, 178, 0.4);
            }

            /* Control Panel Toggle Button */
            .control-panel-toggle {
                position: fixed;
                top: 12px;
                right: 65px;
                width: 44px;
                height: 44px;
                background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
                border: none;
                border-radius: 50%;
                color: white;
                cursor: pointer;
                font-size: 20px;
                box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
                z-index: 1001;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                transition: all 0.3s ease;
            }

            .control-panel-toggle:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 16px rgba(8, 145, 178, 0.4);
            }

            .sidebar-header {
                padding: 16px 16px 12px;
            }

            .sidebar-header h1 {
                font-size: 18px;
            }

            .sidebar-header p {
                font-size: 11px;
            }

            .sidebar-content {
                padding: 12px 16px;
            }

            .section {
                margin-bottom: 18px;
            }

            .section-title {
                font-size: 11px;
                margin-bottom: 10px;
                padding-bottom: 6px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-bottom: 12px;
            }

            .stat {
                padding: 10px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 9px;
            }

            .button-group {
                gap: 6px;
                margin-bottom: 12px;
            }

            .btn {
                padding: 9px 10px;
                font-size: 11px;
            }

            .info-box {
                padding: 10px;
                margin-bottom: 12px;
            }

            .info-box h3 {
                font-size: 11px;
                margin-bottom: 6px;
            }

            .info-item {
                font-size: 10px;
                margin-bottom: 3px;
            }

            .legend {
                padding: 10px;
            }

            .legend h3 {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .legend-item {
                font-size: 10px;
                margin-bottom: 4px;
            }


            .coordinates {
                bottom: 60px;
                left: 10px;
                padding: 8px 10px;
                font-size: 10px;
            }

            .status {
                bottom: 60px;
                right: 10px;
                padding: 8px 10px;
                font-size: 10px;
            }

            .floating-search {
                bottom: 70px;
                right: 10px;
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .floating-search-panel {
                bottom: 120px;
                right: 10px;
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            .sidebar-header h1 {
                font-size: 16px;
            }

            .stat-value {
                font-size: 16px;
            }

            .control-panel-toggle {
                width: 40px;
                height: 40px;
                font-size: 18px;
                top: 10px;
                right: 10px;
            }

            .control-panel {
                right: 10px;
                top: 60px;
                width: 250px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <h1>🗺️ Phường Long Hương</h1>
                <p>TP.HCM</p>
            </div>

            <!-- Content -->
            <div class="sidebar-content">
                <!-- Stats -->
                <div class="section">
                    <div class="section-title">📊 Thống Kê</div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="featureCount">-</div>
                            <div class="stat-label">Thửa Đất</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="zoomLevel">13</div>
                            <div class="stat-label">Zoom</div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="section">
                    <div class="button-group">
                        <button class="btn" onclick="resetMap()">🔄 Reset</button>
                        <button class="btn" onclick="zoomToAll()">📍 Zoom All</button>
                    </div>
                </div>

                <!-- Basemap -->
                <div class="section">
                    <div class="section-title">🗺️ Basemap</div>
                    <div class="layer-control">
                        <input type="checkbox" id="layer-basemap" checked>
                        <label for="layer-basemap">🛰️ Ảnh Vệ Tinh</label>
                    </div>
                </div>

                <!-- Layers -->
                <div class="section">
                    <div class="section-title">📍 Các Lớp</div>
                    <div class="layer-control">
                        <input type="checkbox" id="layer-giaothong" checked>
                        <label for="layer-giaothong">Giao Thông</label>
                    </div>
                    <div class="layer-control">
                        <input type="checkbox" id="layer-songngoi" checked>
                        <label for="layer-songngoi">Sông ngòi</label>
                    </div>
                    <div class="layer-control">
                        <input type="checkbox" id="layer-thuadatcong" checked>
                        <label for="layer-thuadatcong">Thửa Đất Công</label>
                    </div>
                    <div class="layer-control">
                        <input type="checkbox" id="layer-phuongline" checked>
                        <label for="layer-phuongline">Ranh Phường/Khu Phố</label>
                    </div>
                </div>

                <!-- Info -->
                <div class="section">
                    <div class="section-title">ℹ️ Thông Tin</div>
                    <div class="info-box">
                        <h3>GeoJSON Layers</h3>
                        <div class="info-item">
                            <span>Tổng lớp:</span>
                            <strong id="layerCount">5</strong>
                        </div>
                        <div class="info-item">
                            <span>Status:</span>
                            <span id="dataStatus" style="color: #f59e0b;">⏳ Đang tải...</span>
                        </div>
                    </div>
                </div>

                <!-- Legend -->
                <div class="section">
                    <div class="legend">
                        <h3>🎨 Viền Màu</h3>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #f97316;"></div>
                            <span>Giao Thông</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #06b6d4;"></div>
                            <span>Sông ngòi</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ef4444;"></div>
                            <span>Ranh Phường</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #22c55e;"></div>
                            <span>Ranh Khu Phố</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>


            <!-- Coordinates -->
            <div class="map-control coordinates">
                <div id="coordDisplay">Hover để xem tọa độ</div>
            </div>

            <!-- Status -->
            <div class="map-control status success">
                ✓ Sẵn sàng
            </div>

            <!-- Control Panel Toggle Button -->
            <button class="control-panel-toggle" onclick="toggleControlPanel()" title="Quản lý lớp">⚙️</button>

            <!-- Floating Search Panel -->
            <div class="floating-search-panel" id="floatingSearchPanel">
                <input type="text" id="floatingSearchInput" placeholder="Số thửa, tờ..." autocomplete="off">
            </div>

            <!-- Floating Search Button -->
            <button class="floating-search" onclick="toggleFloatingSearch()" title="Tìm kiếm">🔍</button>

            <!-- Right Control Panel -->
            <div class="control-panel" id="controlPanel">
                <div class="control-panel-header">HỆ THỐNG QUẢN LÝ LỚP</div>
                <div class="control-panel-content">
                    <!-- Basemap -->
                    <div class="control-section">
                        <div class="control-section-title">🗺️ Basemap</div>
                        <div class="control-item">
                            <input type="checkbox" id="control-basemap" checked onchange="toggleBasemap(this.checked)">
                            <label for="control-basemap">Ảnh Vệ Tinh</label>
                        </div>
                    </div>

                    <!-- Layers -->
                    <div class="control-section">
                        <div class="control-section-title">📍 Các Lớp</div>
                        <div class="control-item">
                            <input type="checkbox" id="control-giaothong" checked onchange="toggleLayer(this, 'giaothong')">
                            <label for="control-giaothong">Giao Thông</label>
                        </div>
                        <div class="control-item">
                            <input type="checkbox" id="control-songngoi" checked onchange="toggleLayer(this, 'songngoi')">
                            <label for="control-songngoi">Sông Ngòi</label>
                        </div>
                        <div class="control-item">
                            <input type="checkbox" id="control-thuadatcong" checked onchange="toggleLayer(this, 'thuadatcong')">
                            <label for="control-thuadatcong">Thửa Đất Công</label>
                        </div>
                        <div class="control-item">
                            <input type="checkbox" id="control-phuongline" checked onchange="toggleLayer(this, 'phuongline')">
                            <label for="control-phuongline">Ranh Phường/Khu Phố</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Map Config - Zoom vào Phường Long Hương
        const MAP_CENTER = [10.504184, 107.151359];
        const MAP_ZOOM = 14;

        let map = null;
        let layers = {};
        let khuphoLabels = null;
        let basemapLayer = null;
        let currentBasemap = 'satellite';
        const KHUPHO_MIN_ZOOM = 13;

        // Color palette for land types (Thông tư 08)
        const LAND_TYPE_COLORS = {
            'BHK': '#FFB3BA',  // Light pink
            'CAN': '#FF0000',  // Red
            'CLN': '#FFFFCC',  // Light yellow
            'DBV': '#FFB3BA',  // Light pink
            'DCH': '#FFB3BA',  // Light pink
            'DGD': '#ADD8E6',  // Light blue
            'DGT': '#FFA500',  // Orange
            'DNL': '#FFB3BA',  // Light pink
            'DTL': '#ADD8E6',  // Light blue
            'DVH': '#ADD8E6',  // Light blue
            'DYT': '#90EE90',  // Light green
            'CQP': '#FF0000',  // Red
            'LUC': '#FFFFCC',  // Light yellow
            'LUK': '#FFFFCC',  // Light yellow
            'NTD': '#00008B',  // Dark blue
            'NTS': '#0000FF',  // Blue
            'ODT': '#DA70D6',  // Purple/Magenta
            'ONT': '#DA70D6',  // Purple/Magenta
            'SKC': '#00008B',  // Dark blue
            'SON': '#ADD8E6',  // Light blue
            'TMD': '#FFB3BA',  // Light pink
            'TSC': '#FFB3BA',  // Light pink
            'RPH': '#90EE90',  // Light green
            'DTS': '#FFB3BA',  // Light pink
            'DTT': '#FFB3BA',  // Light pink
            'HNK': '#FFB3BA',  // Light pink (giống BHK)
            'default': '#8b5cf6'  // Purple fallback
        };

        const BASEMAPS = {
            satellite: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attribution: '© Esri'
            },
            osm: {
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                attribution: '© OpenStreetMap'
            },
            street: {
                url: 'https://{s}.basemaps.cartocdn.com/rastered/voyager/{z}/{x}/{y}{r}.png',
                attribution: '© CartoDB'
            }
        };

        // Init Map
        function initMap() {
            map = L.map('map').setView(MAP_CENTER, MAP_ZOOM);
            addBasemap('satellite');
            loadGeoJSON();

            map.on('mousemove', updateCoordinates);
            map.on('zoomend', updateZoomLevel);
            map.on('zoomend', updateKhuphoVisibility);

            // Basemap toggle
            const basemapCheckbox = document.getElementById('layer-basemap');
            if (basemapCheckbox) {
                basemapCheckbox.addEventListener('change', e => {
                    toggleBasemap(e.target.checked);
                });
            }

            // Sidebar mặc định ẩn (không thêm class active)
            // document.getElementById('sidebar').classList.add('active');
        }

        // Update Khupho Visibility based on zoom
        function updateKhuphoVisibility() {
            if (!khuphoLabels) return;
            const currentZoom = map.getZoom();
            if (currentZoom >= KHUPHO_MIN_ZOOM) {
                khuphoLabels.eachLayer(layer => layer.setOpacity(1));
            } else {
                khuphoLabels.eachLayer(layer => layer.setOpacity(0));
            }
        }

        // Add Basemap
        function addBasemap(type) {
            if (basemapLayer) {
                map.removeLayer(basemapLayer);
            }

            const bm = BASEMAPS[type];
            basemapLayer = L.tileLayer(bm.url, {
                attribution: bm.attribution,
                maxZoom: 19
            }).addTo(map);

            currentBasemap = type;
        }

        // Toggle Basemap
        function toggleBasemap(visible) {
            if (visible) {
                addBasemap('satellite');
            } else {
                if (basemapLayer) {
                    map.removeLayer(basemapLayer);
                }
            }
        }

        // Load Multiple Layers
        async function loadGeoJSON() {
            try {
                updateStatus('⏳ Đang tải...', 'loading');

                const layerConfigs = {
                    giaothong: { file: 'Giaothong.json', name: 'Giao Thông' },
                    songngoi: { file: 'Songngoi.json', name: 'Sông ngòi' },
                    thuadatcong: { file: 'Thuadatcong.json', name: 'Thửa Đất Công' },
                    phuongline: { file: 'Phuongline.json', name: 'Ranh Phường/Khu Phố' },
                    khupho: { file: 'Khupho.json', name: 'Khu Phố' }
                };

                for (const [key, config] of Object.entries(layerConfigs)) {
                    const response = await fetch(config.file);
                    if (!response.ok) throw new Error(`Lỗi tải ${config.file}`);
                    const data = await response.json();

                    layers[key] = {
                        data: data,
                        layer: null,
                        name: config.name,
                        visible: true
                    };

                    renderLayer(key);
                }

                setupLayerControls();
                updateStatus('✓ Sẵn sàng', 'success');
                document.getElementById('dataStatus').textContent = '✓ Đã tải';
                document.getElementById('dataStatus').style.color = '#10b981';
            } catch (error) {
                console.error('Error:', error);
                updateStatus('❌ Lỗi', 'error');
                document.getElementById('dataStatus').textContent = '❌ Lỗi tải';
                document.getElementById('dataStatus').style.color = '#ef4444';
            }
        }

        // Render Individual Layer
        function renderLayer(key) {
            const layerData = layers[key];
            if (!layerData) return;

            if (layerData.layer) map.removeLayer(layerData.layer);

            let styleFunc, onEachFeatureFunc;

            switch(key) {
                case 'giaothong':
                    styleFunc = feature => ({
                        color: '#f97316',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.3,
                        fillColor: '#f97316'
                    });
                    onEachFeatureFunc = (feature, layer) => {
                        // No tooltip
                    };
                    break;

                case 'songngoi':
                    styleFunc = feature => ({
                        color: '#06b6d4',
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.3,
                        fillColor: '#06b6d4'
                    });
                    onEachFeatureFunc = (feature, layer) => {
                        // No popup for songngoi
                    };
                    break;

                case 'thuadatcong':
                    styleFunc = feature => {
                        const loai = feature.properties.LoaidatHT?.trim() || '';
                        const color = LAND_TYPE_COLORS[loai] || LAND_TYPE_COLORS['default'];
                        return {
                            color: color,
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.6,
                            fillColor: color
                        };
                    };
                    onEachFeatureFunc = (feature, layer) => {
                        const props = feature.properties || {};
                        let popupHTML = `
                            <div style="min-width: 250px; font-size: 12px;">
                                <strong>THỬA ĐẤT CÔNG</strong><hr style="margin: 5px 0;">
                                <table style="width: 100%; border-collapse: collapse;">
                                    <tr><td style="padding: 4px;"><strong>Số tờ:</strong></td><td style="padding: 4px;">${props.So_To || 'N/A'}</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Số thửa:</strong></td><td style="padding: 4px;">${props.Sothua || 'N/A'}</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Loại đất:</strong></td><td style="padding: 4px;">${props.LoaidatHT || 'N/A'}</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Quy hoạch:</strong></td><td style="padding: 4px;">${props.LoaidatQH || 'N/A'}</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Khu phố:</strong></td><td style="padding: 4px;">${props.Khuphomoi || 'N/A'}</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Phường:</strong></td><td style="padding: 4px;">Phường Long Hương</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Thành phố:</strong></td><td style="padding: 4px;">TP. Hồ Chí Minh</td></tr>
                                    <tr><td style="padding: 4px;"><strong>Diện tích:</strong></td><td style="padding: 4px;">${Math.round(props.Dientich || 0)} m²</td></tr>
                                </table>
                            </div>
                        `;
                        layer.bindPopup(popupHTML);
                    };
                    break;

                case 'phuongline':
                    styleFunc = feature => {
                        const ranh = feature.properties.Ranh?.trim() || '';
                        const isPhương = ranh.includes('phường');
                        return {
                            color: isPhương ? '#ef4444' : '#22c55e',
                            weight: isPhương ? 2 : 1,
                            opacity: 1,
                            fillOpacity: 0
                        };
                    };
                    onEachFeatureFunc = (feature, layer) => {
                        // No popup for phuongline
                    };
                    break;

                case 'khupho':
                    if (!khuphoLabels) {
                        khuphoLabels = L.featureGroup();
                        khuphoLabels.addTo(map);
                    }

                    styleFunc = feature => ({
                        color: 'transparent',
                        weight: 0,
                        opacity: 0,
                        fillOpacity: 0
                    });
                    onEachFeatureFunc = (feature, layer) => {
                        const props = feature.properties || {};
                        if (props.Khuphomoi) {
                            // Tính tâm polygon để hiển thị text
                            const bounds = layer.getBounds();
                            const center = bounds.getCenter();

                            // Tạo marker text tại tâm
                            const textMarker = L.marker(center, {
                                icon: L.divIcon({
                                    html: `<div style="font-size: 13px; font-weight: 700; color: #1f2937; text-align: center; pointer-events: none; text-shadow: 1px 1px 2px rgba(255,255,255,0.9); line-height: 1.2;">${props.Khuphomoi}</div>`,
                                    iconSize: [140, 40],
                                    className: 'khupho-label'
                                })
                            });

                            khuphoLabels.addLayer(textMarker);
                        }
                    };
                    break;
            }

            layerData.layer = L.geoJSON(layerData.data, {
                style: styleFunc,
                onEachFeature: onEachFeatureFunc
            });

            // Set z-index cao cho thuadatcong để hiển thị trên các lớp khác
            if (key === 'thuadatcong') {
                layerData.layer.setStyle({
                    className: 'thuadatcong-layer'
                });
                // Bringtofront sau khi thêm vào map
                setTimeout(() => {
                    layerData.layer.bringToFront();
                }, 100);
            }

            if (layerData.visible) {
                layerData.layer.addTo(map);
            }

            return layerData.layer;
        }

        // Setup Layer Controls
        function setupLayerControls() {
            for (const key of Object.keys(layers)) {
                if (key === 'khupho') continue; // Skip khupho, it's always on

                const checkbox = document.getElementById(`layer-${key}`);
                if (checkbox) {
                    checkbox.addEventListener('change', e => {
                        layers[key].visible = e.target.checked;
                        if (e.target.checked) {
                            layers[key].layer.addTo(map);
                        } else {
                            map.removeLayer(layers[key].layer);
                        }
                    });
                }
            }
        }

        // Toggle Layer from Control Panel
        function toggleLayer(checkbox, key) {
            if (!layers[key]) return;
            layers[key].visible = checkbox.checked;
            if (checkbox.checked) {
                layers[key].layer.addTo(map);
            } else {
                map.removeLayer(layers[key].layer);
            }
            // Sync with sidebar checkbox if exists
            const sidebarCheckbox = document.getElementById(`layer-${key}`);
            if (sidebarCheckbox) {
                sidebarCheckbox.checked = checkbox.checked;
            }
        }

        // Update Stats
        function updateStats() {
            let total = 0;
            for (const key of Object.keys(layers)) {
                if (layers[key] && layers[key].data && layers[key].data.features) {
                    total += layers[key].data.features.length;
                }
            }
            document.getElementById('featureCount').textContent = total;
        }

        // Update Zoom
        function updateZoomLevel() {
            document.getElementById('zoomLevel').textContent = map.getZoom();
        }

        // Update Coordinates
        function updateCoordinates(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            document.getElementById('coordDisplay').textContent = `${lat}, ${lng}`;
        }

        // Reset Map
        function resetMap() {
            map.setView(MAP_CENTER, MAP_ZOOM);
            updateStats();
        }

        // Zoom To All
        function zoomToAll() {
            let bounds = null;
            for (const key of Object.keys(layers)) {
                if (layers[key] && layers[key].layer) {
                    const layerBounds = layers[key].layer.getBounds();
                    if (layerBounds.isValid()) {
                        bounds = bounds ? bounds.extend(layerBounds) : layerBounds;
                    }
                }
            }
            if (bounds && bounds.isValid()) {
                map.fitBounds(bounds, { padding: [100, 100] });
            }
        }

        // Toggle Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Toggle Control Panel
        function toggleControlPanel() {
            document.getElementById('controlPanel').classList.toggle('active');
        }

        // Toggle Floating Search
        function toggleFloatingSearch() {
            const panel = document.getElementById('floatingSearchPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                document.getElementById('floatingSearchInput').focus();
            }
        }

        // Floating Search Input Handler
        document.addEventListener('DOMContentLoaded', function() {
            const floatingInput = document.getElementById('floatingSearchInput');
            if (floatingInput) {
                floatingInput.addEventListener('input', e => {
                    const term = e.target.value.toLowerCase();
                    if (!term) {
                        renderLayer('thuadatcong');
                        updateStats();
                        return;
                    }

                    const thuadatcong = layers.thuadatcong;
                    if (!thuadatcong) return;

                    const filtered = thuadatcong.data.features.filter(f => {
                        const props = f.properties || {};
                        const sothua = String(props.Sothua || '').toLowerCase();
                        const soto = String(props.So_To || '').toLowerCase();
                        return sothua.includes(term) || soto.includes(term);
                    });

                    if (thuadatcong.layer) map.removeLayer(thuadatcong.layer);

                    thuadatcong.layer = L.geoJSON({ features: filtered }, {
                        style: feature => {
                            const loai = feature.properties.LoaidatHT?.trim() || '';
                            const color = LAND_TYPE_COLORS[loai] || '#8b5cf6';
                            return {
                                color: color,
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.6,
                                fillColor: color
                            };
                        },
                        onEachFeature: (feature, layer) => {
                            const props = feature.properties || {};
                            let popup = `<strong>Thửa ${props.Sothua}</strong><br>Loại: ${props.LoaidatHT}`;
                            layer.bindPopup(popup);
                        }
                    }).addTo(map);

                    updateStats();
                });
            }
        });

        // Update Status
        function updateStatus(text, type) {
            const status = document.querySelector('.status');
            status.textContent = text;
            status.className = `map-control status ${type}`;
        }

        // Init
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
