<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0891b2">
    <meta name="description" content="Bản đồ vệ tinh Phường Long Hương, TP.HCM">
    <title>Phường Long Hương - Bản Đồ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: white;
            padding: 25px 20px;
            border-bottom: 2px solid #0e7490;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: #0891b2;
            border-radius: 3px;
        }

        /* Sections */
        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #0891b2;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }

        /* Search */
        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #0891b2;
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #0891b2;
        }

        .stat-label {
            font-size: 10px;
            color: #0c7792;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px 12px;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.3);
        }

        /* Info */
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .info-box h3 {
            font-size: 12px;
            font-weight: 700;
            color: #0891b2;
            margin-bottom: 8px;
        }

        .info-item {
            font-size: 11px;
            color: #475569;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        /* Legend */
        .legend {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }

        .legend h3 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0891b2;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* Map */
        .map-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Map Controls */
        .map-control {
            position: absolute;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 999;
            padding: 12px;
            font-size: 11px;
        }

        .basemap-selector {
            top: 20px;
            right: 20px;
        }

        .basemap-selector select {
            padding: 6px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .coordinates {
            bottom: 20px;
            left: 20px;
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .status {
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .status.loading {
            color: #f59e0b;
        }

        .status.success {
            color: #10b981;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 0;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                transition: max-height 0.3s ease;
                z-index: 999;
                border-radius: 0;
            }

            .sidebar:not(.active) {
                max-height: 0;
            }

            .sidebar.active {
                max-height: 100vh;
            }

            .map-container {
                width: 100%;
                height: calc(100vh - 50px);
            }

            .menu-toggle {
                position: fixed;
                top: 12px;
                left: 12px;
                width: 44px;
                height: 44px;
                background: white;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                font-size: 20px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
                z-index: 1001;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }

            .sidebar-header {
                padding: 16px 16px 12px;
            }

            .sidebar-header h1 {
                font-size: 18px;
            }

            .sidebar-header p {
                font-size: 11px;
            }

            .sidebar-content {
                padding: 12px 16px;
            }

            .section {
                margin-bottom: 18px;
            }

            .section-title {
                font-size: 11px;
                margin-bottom: 10px;
                padding-bottom: 6px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-bottom: 12px;
            }

            .stat {
                padding: 10px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 9px;
            }

            .button-group {
                gap: 6px;
                margin-bottom: 12px;
            }

            .btn {
                padding: 9px 10px;
                font-size: 11px;
            }

            .info-box {
                padding: 10px;
                margin-bottom: 12px;
            }

            .info-box h3 {
                font-size: 11px;
                margin-bottom: 6px;
            }

            .info-item {
                font-size: 10px;
                margin-bottom: 3px;
            }

            .legend {
                padding: 10px;
            }

            .legend h3 {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .legend-item {
                font-size: 10px;
                margin-bottom: 4px;
            }

            .basemap-selector {
                top: 60px;
                right: 10px;
                padding: 8px;
            }

            .basemap-selector select {
                font-size: 11px;
                padding: 5px 8px;
            }

            .coordinates {
                bottom: 60px;
                left: 10px;
                padding: 8px 10px;
                font-size: 10px;
            }

            .status {
                bottom: 60px;
                right: 10px;
                padding: 8px 10px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .sidebar-header h1 {
                font-size: 16px;
            }

            .stat-value {
                font-size: 16px;
            }

            .menu-toggle {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <h1>🗺️ Phường Long Hương</h1>
                <p>TP.HCM</p>
            </div>

            <!-- Content -->
            <div class="sidebar-content">
                <!-- Stats -->
                <div class="section">
                    <div class="section-title">📊 Thống Kê</div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="featureCount">-</div>
                            <div class="stat-label">Thửa Đất</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="zoomLevel">13</div>
                            <div class="stat-label">Zoom</div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="section">
                    <div class="section-title">🔍 Tìm Kiếm</div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Số thửa, tờ...">
                    </div>
                    <div class="button-group">
                        <button class="btn" onclick="resetMap()">🔄 Reset</button>
                        <button class="btn" onclick="zoomToAll()">📍 Zoom All</button>
                    </div>
                </div>

                <!-- Basemap -->
                <div class="section">
                    <div class="section-title">🗺️ Basemap</div>
                    <select onchange="changeBasemap()" style="width: 100%; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer;">
                        <option value="satellite">🛰️ Vệ Tinh</option>
                        <option value="osm">🗺️ OpenStreetMap</option>
                        <option value="street">🛣️ CartoDB Street</option>
                    </select>
                </div>

                <!-- Info -->
                <div class="section">
                    <div class="section-title">ℹ️ Thông Tin</div>
                    <div class="info-box">
                        <h3>GeoJSON Data</h3>
                        <div class="info-item">
                            <span>File:</span>
                            <strong>Datcong.geojson</strong>
                        </div>
                        <div class="info-item">
                            <span>Format:</span>
                            <strong>Polygon</strong>
                        </div>
                        <div class="info-item">
                            <span>Status:</span>
                            <span id="dataStatus" style="color: #f59e0b;">⏳ Đang tải...</span>
                        </div>
                    </div>
                </div>

                <!-- Legend -->
                <div class="section">
                    <div class="legend">
                        <h3>🎨 Viền Màu</h3>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ef4444;"></div>
                            <span>Ranh Giới Thửa Đất</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>

            <!-- Basemap Selector -->
            <div class="map-control basemap-selector">
                <select id="basemapSelect" onchange="changeBasemap()" style="font-size: 11px;">
                    <option value="satellite">🛰️ Vệ Tinh</option>
                    <option value="osm">🗺️ OSM</option>
                    <option value="street">🛣️ Street</option>
                </select>
            </div>

            <!-- Coordinates -->
            <div class="map-control coordinates">
                <div id="coordDisplay">Hover để xem tọa độ</div>
            </div>

            <!-- Status -->
            <div class="map-control status success">
                ✓ Sẵn sàng
            </div>

            <!-- Menu Toggle (Mobile) -->
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        </div>
    </div>

    <script>
        // Map Config
        const MAP_CENTER = [10.7, 106.8];
        const MAP_ZOOM = 13;

        let map = null;
        let geoJsonLayer = null;
        let allFeatures = [];
        let currentBasemap = 'satellite';

        const BASEMAPS = {
            satellite: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attribution: '© Esri'
            },
            osm: {
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                attribution: '© OpenStreetMap'
            },
            street: {
                url: 'https://{s}.basemaps.cartocdn.com/rastered/voyager/{z}/{x}/{y}{r}.png',
                attribution: '© CartoDB'
            }
        };

        // Init Map
        function initMap() {
            map = L.map('map').setView(MAP_CENTER, MAP_ZOOM);
            addBasemap('satellite');
            loadGeoJSON();

            map.on('mousemove', updateCoordinates);
            map.on('zoomend', updateZoomLevel);

            document.getElementById('sidebar').classList.add('active');
        }

        // Add Basemap
        function addBasemap(type) {
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer) {
                    map.removeLayer(layer);
                }
            });

            const bm = BASEMAPS[type];
            L.tileLayer(bm.url, {
                attribution: bm.attribution,
                maxZoom: 19
            }).addTo(map);

            currentBasemap = type;
        }

        // Change Basemap
        function changeBasemap() {
            const type = document.getElementById('basemapSelect').value;
            addBasemap(type);
        }

        // Load GeoJSON
        async function loadGeoJSON() {
            try {
                updateStatus('⏳ Đang tải...', 'loading');

                const response = await fetch('Datcong.geojson');
                if (!response.ok) throw new Error('Lỗi tải file');

                const data = await response.json();
                allFeatures = data.features || [];

                renderGeoJSON(data);
                updateStats();
                updateStatus('✓ Sẵn sàng', 'success');
                document.getElementById('dataStatus').textContent = '✓ Đã tải';
                document.getElementById('dataStatus').style.color = '#10b981';
            } catch (error) {
                console.error('Error:', error);
                updateStatus('❌ Lỗi', 'error');
                document.getElementById('dataStatus').textContent = '❌ Lỗi tải';
                document.getElementById('dataStatus').style.color = '#ef4444';
            }
        }

        // Render GeoJSON
        function renderGeoJSON(data) {
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);

            geoJsonLayer = L.geoJSON(data, {
                pointToLayer: (feature, latlng) => {
                    return L.circleMarker(latlng, {
                        radius: 6,
                        fillColor: '#0891b2',
                        color: 'white',
                        weight: 2,
                        opacity: 0.9,
                        fillOpacity: 0.7
                    });
                },
                style: feature => ({
                    color: '#ef4444',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0
                }),
                onEachFeature: (feature, layer) => {
                    const props = feature.properties || {};
                    let popup = '<div style="min-width: 180px;">';
                    if (props.Sothua) popup += `<strong>Thửa:</strong> ${props.Sothua}<br>`;
                    if (props.So_To) popup += `<strong>Tờ:</strong> ${props.So_To}<br>`;
                    if (props.Shape_Area) popup += `<strong>Diện tích:</strong> ${Math.round(props.Shape_Area)} m²`;
                    popup += '</div>';
                    layer.bindPopup(popup);
                }
            }).addTo(map);

            if (geoJsonLayer.getBounds().isValid()) {
                map.fitBounds(geoJsonLayer.getBounds(), { padding: [100, 100] });
            }
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            if (!term) {
                renderGeoJSON({ features: allFeatures });
                updateStats();
                return;
            }

            const filtered = allFeatures.filter(f => {
                const props = f.properties || {};
                const sothua = String(props.Sothua || '').toLowerCase();
                const soto = String(props.So_To || '').toLowerCase();
                return sothua.includes(term) || soto.includes(term);
            });

            renderGeoJSON({ features: filtered });
            updateStats(filtered.length);
        });

        // Update Stats
        function updateStats(count = null) {
            const total = count !== null ? count : allFeatures.length;
            document.getElementById('featureCount').textContent = total;
        }

        // Update Zoom
        function updateZoomLevel() {
            document.getElementById('zoomLevel').textContent = map.getZoom();
        }

        // Update Coordinates
        function updateCoordinates(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            document.getElementById('coordDisplay').textContent = `${lat}, ${lng}`;
        }

        // Reset Map
        function resetMap() {
            map.setView(MAP_CENTER, MAP_ZOOM);
            document.getElementById('searchInput').value = '';
            if (geoJsonLayer) renderGeoJSON({ features: allFeatures });
            updateStats();
        }

        // Zoom To All
        function zoomToAll() {
            if (geoJsonLayer && geoJsonLayer.getBounds().isValid()) {
                map.fitBounds(geoJsonLayer.getBounds(), { padding: [100, 100] });
            }
        }

        // Toggle Sidebar (Mobile)
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Update Status
        function updateStatus(text, type) {
            const status = document.querySelector('.status');
            status.textContent = text;
            status.className = `map-control status ${type}`;
        }

        // Init
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
